name: Build iOS IPA for Sideloadly

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: パッケージのインストール
        run: npm install

      - name: 【重要】Expo Prebuild（ここでiosフォルダを錬成）
        run: npx expo prebuild --platform ios --clean

      - name: 署名なしIPAのビルド（Sideloadly用）
        run: |
          cd ios
          # 自動生成されたワークスペース名を確実に取得するロジック
          WORKSPACE_NAME=$(ls | grep '\.xcworkspace$' | head -n 1)
          SCHEME_NAME=$(basename "$WORKSPACE_NAME" .xcworkspace)
          
          echo "Found workspace: $WORKSPACE_NAME"
          echo "Found scheme: $SCHEME_NAME"
          
          # Xcodeビルド実行（署名なし設定）
          xcodebuild -workspace "$WORKSPACE_NAME" -scheme "$SCHEME_NAME" -configuration Release -sdk iphoneos -archivePath ./build/app.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          
          # ビルドされたアプリを .ipa 形式にパッケージング
          mkdir -p Payload
          cp -r ./build/app.xcarchive/Products/Applications/*.app Payload/
          zip -r ../app.ipa Payload

      - name: 完成品（IPA）のアップロード
        uses: actions/upload-artifact@v4
        with:
          name: TreAla-IPA
          path: app.ipa